# Quality assurance for the MotionPR repository. Read-only token, no secrets, and nothing here
# publishes anything: releases are manual (PUBLISHING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Chromium build that matches the bundled Playwright, plus its system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      # Agent bundle, report viewer, demo app and CLI; the integration and e2e suites use dist/.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm version:check
      # Unit tests, including the documentation checks (exports, steps, links, config examples,
      # and that no workflow can publish to npm).
      - run: pnpm test
      # Real Chromium: capture engine, GSAP / Anime.js / Lenis adapters, the CLI end to end.
      - run: pnpm test:integration
      # The demo app captured for real (every intended change found, nothing else), the report
      # viewer, and the website served like GitHub Pages serves it.
      - run: pnpm test:e2e
      # What would ship to npm: allowlist, entry points, types, installed and run in a clean project.
      - run: node scripts/pack-check.mjs --install
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  package-node-22:
    # The published package declares Node >= 22.12: install the tarball and run it on Node 22.
    name: package on Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/pack-check.mjs --install
