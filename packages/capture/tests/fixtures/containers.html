<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scroll containers fixture</title>
    <!--
      Native scroll containers (viewport 800×600):
      - feed: 300px tall, 2000px of content, scrolled by steps; the card 900px into it fades in
        when it enters the feed (IntersectionObserver rooted at the feed).
      - carousel: 400px wide, five 400px slides with scroll snapping; "next" scrolls it by
        `?step=` px (default 400) with smooth behavior, from application code.
      - chat: does not overflow until "send" appends messages and smooth-scrolls to the end.
      - below: a container below the fold; covered: a container under an overlay.
      `?snap=none` turns off the carousel's snapping.
    -->
    <style>
      html,
      body {
        margin: 0;
        font: 14px sans-serif;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px;
        align-items: flex-start;
      }
      .row > * {
        flex: none;
      }
      [data-testid="feed"] {
        width: 240px;
        height: 300px;
        overflow-y: auto;
        border: 1px solid #ccc;
      }
      [data-testid="feed"] .content {
        position: relative;
        height: 2000px;
      }
      [data-testid="card"] {
        position: absolute;
        top: 900px;
        left: 20px;
        width: 160px;
        height: 80px;
        background: #0984e3;
        opacity: 0;
        transition: opacity 300ms ease-out;
      }
      [data-testid="card"].in {
        opacity: 1;
      }
      [data-testid="carousel"] {
        width: 400px;
        height: 120px;
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        border: 1px solid #ccc;
      }
      .no-snap [data-testid="carousel"] {
        scroll-snap-type: none;
      }
      .slide {
        flex: none;
        width: 400px;
        height: 100px;
        scroll-snap-align: start;
        background: linear-gradient(90deg, #eee, #ccc);
      }
      [data-testid="chat"] {
        width: 200px;
        height: 160px;
        overflow-y: auto;
        border: 1px solid #ccc;
      }
      .message {
        height: 40px;
        border-bottom: 1px solid #eee;
      }
      [data-testid="below"] {
        position: absolute;
        top: 1400px;
        left: 16px;
        width: 200px;
        height: 100px;
        overflow-y: auto;
      }
      .stage {
        position: relative;
        width: 200px;
        height: 100px;
      }
      [data-testid="covered"] {
        width: 200px;
        height: 100px;
        overflow-y: auto;
      }
      [data-testid="overlay"] {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.1);
      }
      .tall {
        height: 600px;
      }
    </style>
    <script>
      window.params = new URLSearchParams(location.search);
      if (params.get("snap") === "none") document.documentElement.classList.add("no-snap");
    </script>
  </head>
  <body>
    <div class="row">
      <div data-testid="feed">
        <div class="content"><div data-testid="card"></div></div>
      </div>
      <div>
        <div data-testid="carousel">
          <div class="slide"></div>
          <div class="slide"></div>
          <div class="slide"></div>
          <div class="slide"></div>
          <div class="slide"></div>
        </div>
        <button data-testid="next">Next</button>
      </div>
      <div>
        <div data-testid="chat"><div class="message"></div></div>
        <button data-testid="send">Send</button>
      </div>
      <div class="stage">
        <div data-testid="covered"><div class="tall"></div></div>
        <div data-testid="overlay"></div>
      </div>
    </div>
    <div data-testid="below"><div class="tall"></div></div>
    <script>
      const feed = document.querySelector("[data-testid=feed]");
      const card = document.querySelector("[data-testid=card]");
      new IntersectionObserver(
        (entries) => {
          for (const e of entries) if (e.isIntersecting) card.classList.add("in");
        },
        { root: feed },
      ).observe(card);

      const carousel = document.querySelector("[data-testid=carousel]");
      const step = Number(params.get("step") ?? 400);
      document.querySelector("[data-testid=next]").addEventListener("click", () => {
        carousel.scrollBy({ left: step, behavior: "smooth" });
      });

      const chat = document.querySelector("[data-testid=chat]");
      document.querySelector("[data-testid=send]").addEventListener("click", () => {
        for (let i = 0; i < 9; i++) {
          const m = document.createElement("div");
          m.className = "message";
          chat.append(m);
        }
        chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
      });
    </script>
  </body>
</html>
